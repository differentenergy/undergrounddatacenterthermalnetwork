<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BroadCore 热力基础设施 | Thermal Infrastructure</title>
    <meta name="description" content="地下热力高速公路连接数据中心与住宅 | Underground thermal superhighway connecting data centers to homes">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @keyframes flow {
            0% { transform: translateX(0); }
            100% { transform: translateX(100%); }
        }
        .flow-line {
            animation: flow 10s linear infinite;
        }
        * {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body class="bg-slate-950">
    
    <div id="root"></div>
    
    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        function BroadCoreThermal() {
            const [flowAnimation, setFlowAnimation] = useState(0);
            const [selectedScenario, setSelectedScenario] = useState('winter');
            const [language, setLanguage] = useState('zh');
            const canvasRef = useRef(null);
            
            // Initialize Lucide icons
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [language, selectedScenario]);
            
            // Translation content
            const content = {
                zh: {
                    heroTag: 'BROADCORE 热力基础设施',
                    heroTitle1: '废热',
                    heroTitle2: '是新的能源网络',
                    heroSubtitle: '地下热力高速公路连接数据中心与住宅',
                    heroSubtitle2: '将80°C废热转化为社区温暖',
                    exploreBtn: '探索技术',
                    downloadBtn: '下载白皮书',
                    costReduction: '成本降低',
                    maxDistance: '最大距离',
                    homesServed: '服务家庭',
                    howItWorks: '工作原理',
                    subtitle: '实时地下热力网络',
                    winterMode: '❄️ 冬季模式（供暖）',
                    summerMode: '☀️ 夏季模式（制冷）',
                    winterExplain: '冬季：数据中心 → 住宅',
                    winterDesc: '来自数据中心废热的热水（75°C）通过BroadCore管道输送。每个家庭的热交换器提取热量。回水（45°C）循环返回。',
                    winterResult: '结果：为5000户家庭提供免费供暖',
                    summerExplain: '夏季：住宅 → 数据中心',
                    summerDesc: '来自数据中心冷却系统的冷水（5°C）输送到住宅。热交换器吸收家庭热量。温水（15°C）返回冷却数据中心。',
                    summerResult: '结果：住宅和数据中心免费制冷',
                    broadcoreAdvantage: 'BroadCore优势',
                    advantage1: '三层复合材料：钢芯 + 隔热层 + 防腐层',
                    advantage2: '50年使用寿命：埋深10米，免受风化影响',
                    advantage3: '最小热损失：真空隔热，每公里损失<2%',
                    techSpecs: '技术规格',
                    specsSubtitle: '为最高效率而设计',
                    ctaTitle: '准备建设热力基础设施？',
                    ctaSubtitle: '与Broad合作在您的城市部署BroadCore',
                    scheduleBtn: '预约咨询',
                    downloadSpecsBtn: '下载技术规格',
                    viewOnGithub: '查看源代码',
                },
                en: {
                    heroTag: 'BROADCORE THERMAL INFRASTRUCTURE',
                    heroTitle1: 'Waste Heat',
                    heroTitle2: 'Is The New Grid',
                    heroSubtitle: 'Underground thermal superhighway connecting data centers to homes',
                    heroSubtitle2: 'Turn 80°C waste into neighborhood warmth',
                    exploreBtn: 'Explore the Technology',
                    downloadBtn: 'Download Whitepaper',
                    costReduction: 'Cost Reduction',
                    maxDistance: 'Max Distance',
                    homesServed: 'Homes Served',
                    howItWorks: 'How It Works',
                    subtitle: 'Underground thermal network in real-time',
                    winterMode: '❄️ Winter Mode (Heating)',
                    summerMode: '☀️ Summer Mode (Cooling)',
                    winterExplain: 'Winter: Data Center → Homes',
                    winterDesc: 'Hot water (75°C) from data center waste heat travels through BroadCore pipe. Heat exchanger at each home extracts warmth. Return water (45°C) cycles back.',
                    winterResult: 'Result: Free heating for 5,000 homes',
                    summerExplain: 'Summer: Homes → Data Center',
                    summerDesc: 'Cold water (5°C) from data center cooling system travels to homes. Heat exchanger absorbs home heat. Warm water (15°C) returns to chill data center.',
                    summerResult: 'Result: Free cooling for homes + data center',
                    broadcoreAdvantage: 'BroadCore Advantage',
                    advantage1: '3-layer composite: Steel core + insulation + corrosion barrier',
                    advantage2: '50-year lifespan: Buried 10m deep, protected from weathering',
                    advantage3: 'Minimal heat loss: <2% per km with vacuum insulation',
                    techSpecs: 'Technical Specifications',
                    specsSubtitle: 'Engineered for maximum efficiency',
                    ctaTitle: 'Ready to Build Thermal Infrastructure?',
                    ctaSubtitle: 'Partner with Broad to deploy BroadCore in your city',
                    scheduleBtn: 'Schedule Consultation',
                    downloadSpecsBtn: 'Download Technical Specs',
                    viewOnGithub: 'View Source Code',
                },
            };
            
            const t = content[language];
            
            // Animate flow
            useEffect(() => {
                const interval = setInterval(() => {
                    setFlowAnimation(prev => (prev + 1) % 100);
                }, 50);
                return () => clearInterval(interval);
            }, []);
            
            // Draw canvas
            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                
                const ctx = canvas.getContext('2d');
                const width = canvas.width;
                const height = canvas.height;
                
                // Clear
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(0, 0, width, height);
                
                // Ground layers
                const layers = [
                    { y: height * 0.15, color: '#1e293b' },
                    { y: height * 0.35, color: '#334155' },
                    { y: height * 0.55, color: '#475569' },
                    { y: height * 0.75, color: '#64748b' },
                ];
                
                layers.forEach((layer, i) => {
                    ctx.fillStyle = layer.color;
                    const nextY = i < layers.length - 1 ? layers[i + 1].y : height;
                    ctx.fillRect(0, layer.y, width, nextY - layer.y);
                });
                
                // Data center
                const dcX = 50, dcY = height * 0.1, dcWidth = 80, dcHeight = 40;
                ctx.fillStyle = '#1e40af';
                ctx.fillRect(dcX, dcY, dcWidth, dcHeight);
                ctx.strokeStyle = '#3b82f6';
                ctx.lineWidth = 2;
                ctx.strokeRect(dcX, dcY, dcWidth, dcHeight);
                
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 11px sans-serif';
                ctx.fillText(language === 'zh' ? '数据中心' : 'DATA CENTER', dcX + 5, dcY + 20);
                ctx.font = '9px monospace';
                ctx.fillText('80°C', dcX + 5, dcY + 32);
                
                // Homes
                const homes = [
                    { x: width - 150, y: height * 0.08 },
                    { x: width - 100, y: height * 0.08 },
                    { x: width - 50, y: height * 0.08 },
                ];
                
                homes.forEach(home => {
                    ctx.fillStyle = '#059669';
                    ctx.fillRect(home.x, home.y + 10, 25, 20);
                    ctx.beginPath();
                    ctx.moveTo(home.x - 3, home.y + 10);
                    ctx.lineTo(home.x + 12.5, home.y);
                    ctx.lineTo(home.x + 28, home.y + 10);
                    ctx.closePath();
                    ctx.fill();
                });
                
                // Pipe
                const pipeY = height * 0.6;
                const pipeStartX = dcX + dcWidth/2;
                const pipeEndX = width - 100;
                
                ctx.strokeStyle = '#71717a';
                ctx.lineWidth = 16;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(pipeStartX, dcY + dcHeight);
                ctx.lineTo(pipeStartX, pipeY);
                ctx.lineTo(pipeEndX, pipeY);
                ctx.lineTo(pipeEndX, height * 0.15);
                ctx.stroke();
                
                // Flow
                ctx.strokeStyle = selectedScenario === 'winter' ? '#ef4444' : '#3b82f6';
                ctx.lineWidth = 10;
                ctx.setLineDash([20, 10]);
                ctx.lineDashOffset = -flowAnimation * 2;
                ctx.beginPath();
                ctx.moveTo(pipeStartX, dcY + dcHeight);
                ctx.lineTo(pipeStartX, pipeY);
                ctx.lineTo(pipeEndX, pipeY);
                ctx.lineTo(pipeEndX, height * 0.15);
                ctx.stroke();
                ctx.setLineDash([]);
                
                // Labels
                ctx.fillStyle = '#94a3b8';
                ctx.font = 'bold 12px sans-serif';
                ctx.fillText('BroadCore', width/2 - 30, pipeY - 20);
                ctx.font = '10px monospace';
                ctx.fillText(language === 'zh' ? '地下10米' : '10m underground', width/2 - 40, pipeY - 5);
                
            }, [flowAnimation, selectedScenario, language]);
            
            return (
                <div className="min-h-screen bg-slate-950 text-white">
                    {/* Language Toggle */}
                    <div className="fixed top-6 right-6 z-50">
                        <button
                            onClick={() => setLanguage(language === 'zh' ? 'en' : 'zh')}
                            className="flex items-center gap-2 px-4 py-2 bg-slate-800/90 backdrop-blur-xl border border-slate-700 rounded-full hover:bg-slate-700/90 transition-all shadow-xl"
                        >
                            <i data-lucide="globe" className="w-4 h-4"></i>
                            <span className="font-semibold">{language === 'zh' ? '中文' : 'English'}</span>
                            <div className="w-px h-4 bg-slate-600" />
                            <span className="text-slate-400 text-sm">{language === 'zh' ? 'EN' : '中'}</span>
                        </button>
                    </div>
                    
                    {/* Hero */}
                    <section className="relative min-h-screen flex items-center justify-center overflow-hidden">
                        <div className="absolute inset-0 bg-gradient-to-br from-blue-950 via-slate-900 to-emerald-950">
                            {[...Array(5)].map((_, i) => (
                                <div
                                    key={i}
                                    className="flow-line absolute h-px bg-gradient-to-r from-transparent via-blue-400/30 to-transparent"
                                    style={{
                                        top: `${20 + i * 20}%`,
                                        left: '-100%',
                                        right: '-100%',
                                        animationDelay: `${i * 0.5}s`,
                                    }}
                                />
                            ))}
                        </div>
                        
                        <div className="relative z-10 max-w-7xl mx-auto px-6 text-center">
                            <div className="mb-8 inline-block">
                                <div className="inline-flex items-center gap-3 px-4 py-2 bg-blue-500/10 border border-blue-400/30 rounded-full backdrop-blur-xl">
                                    <i data-lucide="waves" className="w-5 h-5 text-blue-400"></i>
                                    <span className="text-sm font-semibold text-blue-300 tracking-wide">{t.heroTag}</span>
                                </div>
                            </div>
                            
                            <h1 className="text-6xl md:text-8xl font-black mb-6 tracking-tight">
                                <span className="block bg-gradient-to-r from-blue-400 via-emerald-400 to-blue-400 bg-clip-text text-transparent">
                                    {t.heroTitle1}
                                </span>
                                <span className="block text-white">{t.heroTitle2}</span>
                            </h1>
                            
                            <p className="text-xl md:text-3xl text-slate-300 mb-12 max-w-3xl mx-auto leading-relaxed">
                                {t.heroSubtitle}
                                <span className="block mt-2 text-blue-300">{t.heroSubtitle2}</span>
                            </p>
                            
                            <div className="flex flex-col sm:flex-row gap-4 justify-center items-center mb-12">
                                <button className="group px-8 py-4 bg-gradient-to-r from-blue-600 to-emerald-600 rounded-xl font-bold text-lg shadow-2xl hover:shadow-blue-500/50 transition-all hover:scale-105 flex items-center gap-2">
                                    {t.exploreBtn}
                                    <i data-lucide="arrow-right" className="w-5 h-5"></i>
                                </button>
                                <button className="px-8 py-4 bg-white/5 backdrop-blur border border-white/10 rounded-xl font-bold text-lg hover:bg-white/10 transition-all">
                                    {t.downloadBtn}
                                </button>
                            </div>
                            
                            <div className="grid grid-cols-3 gap-8 max-w-2xl mx-auto">
                                <div>
                                    <div className="text-4xl font-black text-blue-400 mb-2">40%</div>
                                    <div className="text-sm text-slate-400">{t.costReduction}</div>
                                </div>
                                <div>
                                    <div className="text-4xl font-black text-emerald-400 mb-2">8 km</div>
                                    <div className="text-sm text-slate-400">{t.maxDistance}</div>
                                </div>
                                <div>
                                    <div className="text-4xl font-black text-orange-400 mb-2">5,000</div>
                                    <div className="text-sm text-slate-400">{t.homesServed}</div>
                                </div>
                            </div>
                        </div>
                    </section>
                    
                    {/* Interactive Diagram */}
                    <section className="py-24 bg-gradient-to-b from-slate-950 to-slate-900">
                        <div className="max-w-7xl mx-auto px-6">
                            <div className="text-center mb-16">
                                <h2 className="text-5xl font-black mb-4">{t.howItWorks}</h2>
                                <p className="text-xl text-slate-400">{t.subtitle}</p>
                            </div>
                            
                            <div className="flex justify-center gap-4 mb-8">
                                <button
                                    onClick={() => setSelectedScenario('winter')}
                                    className={`px-6 py-3 rounded-xl font-semibold transition-all ${
                                        selectedScenario === 'winter'
                                            ? 'bg-red-500 text-white shadow-lg shadow-red-500/50'
                                            : 'bg-slate-800 text-slate-400 hover:bg-slate-700'
                                    }`}
                                >
                                    {t.winterMode}
                                </button>
                                <button
                                    onClick={() => setSelectedScenario('summer')}
                                    className={`px-6 py-3 rounded-xl font-semibold transition-all ${
                                        selectedScenario === 'summer'
                                            ? 'bg-blue-500 text-white shadow-lg shadow-blue-500/50'
                                            : 'bg-slate-800 text-slate-400 hover:bg-slate-700'
                                    }`}
                                >
                                    {t.summerMode}
                                </button>
                            </div>
                            
                            <div className="bg-slate-900 rounded-2xl p-8 border border-slate-700 shadow-2xl">
                                <canvas ref={canvasRef} width={1000} height={500} className="w-full rounded-xl" />
                                
                                <div className="mt-8 grid md:grid-cols-2 gap-6">
                                    <div className="bg-slate-800/50 rounded-xl p-6 border border-slate-700/50">
                                        <h3 className="text-xl font-bold mb-3 flex items-center gap-2">
                                            <i data-lucide="thermometer" className="w-5 h-5"></i>
                                            <span className={selectedScenario === 'winter' ? 'text-red-400' : 'text-blue-400'}>
                                                {selectedScenario === 'winter' ? t.winterExplain : t.summerExplain}
                                            </span>
                                        </h3>
                                        <p className="text-slate-300 leading-relaxed">
                                            {selectedScenario === 'winter' ? t.winterDesc : t.summerDesc}
                                            <span className={`block mt-2 font-semibold ${selectedScenario === 'winter' ? 'text-emerald-400' : 'text-blue-400'}`}>
                                                {selectedScenario === 'winter' ? t.winterResult : t.summerResult}
                                            </span>
                                        </p>
                                    </div>
                                    
                                    <div className="bg-slate-800/50 rounded-xl p-6 border border-slate-700/50">
                                        <h3 className="text-xl font-bold mb-3 flex items-center gap-2">
                                            <i data-lucide="waves" className="w-5 h-5"></i>
                                            <span>{t.broadcoreAdvantage}</span>
                                        </h3>
                                        <ul className="space-y-2 text-slate-300">
                                            <li className="flex items-start gap-2">
                                                <i data-lucide="check-circle" className="w-5 h-5 text-emerald-400 flex-shrink-0 mt-0.5"></i>
                                                <span>{t.advantage1}</span>
                                            </li>
                                            <li className="flex items-start gap-2">
                                                <i data-lucide="check-circle" className="w-5 h-5 text-emerald-400 flex-shrink-0 mt-0.5"></i>
                                                <span>{t.advantage2}</span>
                                            </li>
                                            <li className="flex items-start gap-2">
                                                <i data-lucide="check-circle" className="w-5 h-5 text-emerald-400 flex-shrink-0 mt-0.5"></i>
                                                <span>{t.advantage3}</span>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>
                    
                    {/* CTA */}
                    <section className="py-24 bg-gradient-to-br from-blue-600 to-emerald-600">
                        <div className="max-w-4xl mx-auto px-6 text-center">
                            <h2 className="text-5xl font-black mb-6">{t.ctaTitle}</h2>
                            <p className="text-2xl mb-12 text-blue-100">{t.ctaSubtitle}</p>
                            
                            <div className="flex flex-col sm:flex-row gap-4 justify-center mb-8">
                                <button className="px-8 py-4 bg-white text-blue-600 rounded-xl font-bold text-lg shadow-2xl hover:scale-105 transition-all">
                                    {t.scheduleBtn}
                                </button>
                                <button className="px-8 py-4 bg-blue-800 text-white rounded-xl font-bold text-lg hover:bg-blue-900 transition-all">
                                    {t.downloadSpecsBtn}
                                </button>
                            </div>
                            
                            <div className="mt-8">
                                <a 
                                    href="https://github.com/differentenergy/undergrounddatacenterthermalnetwork" 
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="inline-flex items-center gap-2 px-6 py-3 bg-slate-900/50 backdrop-blur rounded-xl hover:bg-slate-900/70 transition-all"
                                >
                                    <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                                        <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                                    </svg>
                                    <span>{t.viewOnGithub}</span>
                                </a>
                            </div>
                        </div>
                    </section>
                    
                    {/* Footer */}
                    <footer className="bg-slate-950 border-t border-slate-800 py-8">
                        <div className="max-w-7xl mx-auto px-6 text-center text-slate-500 text-sm">
                            <p>© 2026 Broad. {language === 'zh' ? 'AI时代的地下热力基础设施' : 'Underground thermal infrastructure for the AI age'}</p>
                        </div>
                    </footer>
                </div>
            );
        }
        
        // Render
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BroadCoreThermal />);
    </script>
</body>
</html>
