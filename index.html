      ctx.lineWidth = 1.5;

    ctx.lineTo(pipeEndX, height * 0.15);

    // Animate flow
    ctx.setLineDash([20, 10]);
    ctx.lineDashOffset = -flowAnimation * 2;
    
    ctx.beginPath();
    ctx.moveTo(pipeStartX, dcY + dcHeight);
    ctx.lineTo(pipeStartX, pipeY);
    ctx.lineTo(pipeEndX, pipeY);
    ctx.lineTo(pipeEndX, height * 0.15);
    ctx.stroke();
    
    ctx.setLineDash([]);

    const particlePositions = [
      { x: pipeStartX, y: dcY + dcHeight + (flowAnimation * 1.5) },
      { x: pipeStartX, y: pipeY },
      { x: pipeStartX + ((pipeEndX - pipeStartX) * (flowAnimation / 100)), y: pipeY },
      { x: pipeEndX, y: pipeY - (flowAnimation * 1.5) },
    ];
    
    particlePositions.forEach(pos => {
      if (pos.y >= dcY + dcHeight && pos.y <= pipeY + 10 && pos.x >= pipeStartX && pos.x <= pipeEndX) {
        const gradient = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, 8);

        gradient.addColorStop(1, 'rgba(239, 68, 68, 0)');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, 8, 0, Math.PI * 2);
        ctx.fill();
      }
    });
